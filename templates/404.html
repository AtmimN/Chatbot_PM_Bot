{% extends "base.html" %}

{% block title %}Halaman Tidak Ditemukan &middot; PM-Bot{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-card">
    <div class="error-code">{{ code | default(404) }}</div>
    <h1>Perhatian</h1>
    <p>{{ message | default("Halaman atau tema yang Anda tuju tidak ditemukan.") }}</p>
    <a href="{{ url_for('index') }}" class="btn-primary">Kembali ke Halaman Utama</a>
  </div>
</section>
{% endblock %}
